<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoodBudget — Expense Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- ===== Header ===== -->
  <header class="masthead">
    <div class="masthead-mark">₹</div>
    <div class="masthead-text">
      <h1>GoodBudget</h1>
      <p>A running record of where the money goes.</p>
    </div>
  </header>

  <div class="layout">

    <!-- ===== Entry form ===== -->
    <section class="entry-panel" aria-label="Add or edit an expense">
      <h2 id="form-heading">New entry</h2>
      <form id="expense-form" autocomplete="off">
        <input type="hidden" id="expense-id">

        <label for="title">Title</label>
        <input type="text" id="title" placeholder="e.g. Auto to office" required maxlength="60">

        <div class="row">
          <div class="field">
            <label for="amount">Amount (₹)</label>
            <input type="number" id="amount" placeholder="0" min="0" step="0.01" required>
          </div>
          <div class="field">
            <label for="date">Date</label>
            <input type="date" id="date" required>
          </div>
        </div>

        <label for="category">Category</label>
        <select id="category" required>
          <option value="Food">Food</option>
          <option value="Travel">Travel</option>
          <option value="Shopping">Shopping</option>
          <option value="Bills">Bills</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Other">Other</option>
        </select>

        <label for="description">Description <span class="optional">optional</span></label>
        <textarea id="description" placeholder="Any extra detail worth remembering" maxlength="200" rows="3"></textarea>

        <div class="form-actions">
          <button type="submit" id="submit-btn" class="btn-primary">Add entry</button>
          <button type="button" id="cancel-edit-btn" class="btn-ghost" hidden>Cancel</button>
        </div>
      </form>
    </section>

    <!-- ===== Ledger + summary ===== -->
    <section class="ledger-panel" aria-label="Expense ledger">

      <div class="summary" id="summary">
        <div class="summary-total">
          <span class="summary-label">Total spent</span>
          <span class="summary-value" id="total-amount">₹0.00</span>
          <span class="summary-count" id="entry-count">0 entries</span>
        </div>
        <div class="summary-breakdown" id="category-breakdown">
          <!-- filled by JS -->
        </div>
      </div>

      <div class="controls">
        <input type="search" id="search-input" placeholder="Search title or description…" aria-label="Search expenses">

        <select id="filter-category" aria-label="Filter by category">
          <option value="">All categories</option>
          <option value="Food">Food</option>
          <option value="Travel">Travel</option>
          <option value="Shopping">Shopping</option>
          <option value="Bills">Bills</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Other">Other</option>
        </select>

        <div class="date-range">
          <input type="date" id="filter-from" aria-label="From date">
          <span class="date-sep">to</span>
          <input type="date" id="filter-to" aria-label="To date">
        </div>

        <button type="button" id="clear-filters-btn" class="btn-text">Clear filters</button>
      </div>

      <div class="table-wrap">
        <table id="expense-table">
          <thead>
            <tr>
              <th class="col-date">Date</th>
              <th class="col-title">Title</th>
              <th class="col-category">Category</th>
              <th class="col-amount">Amount</th>
              <th class="col-actions"></th>
            </tr>
          </thead>
          <tbody id="expense-rows">
            <!-- filled by JS -->
          </tbody>
        </table>
        <div id="empty-state" class="empty-state" hidden>
          <p>No entries here yet.</p>
          <p class="empty-sub">Add your first expense on the left, or clear your filters.</p>
        </div>
      </div>

    </section>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="script.js"></script>
</body>
</html>
